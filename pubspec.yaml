name: quomia
description: "The greatest social application ever created"
publish_to: "none"
version: 0.2.0

environment:
  sdk: ^3.5.2

dependencies:
  carousel_slider: ^5.0.0
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.8.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  pin_code_fields: ^8.0.1
  simple_gradient_text: ^1.3.0
  video_player: ^2.9.2
  intl: ^0.18.0
  file_picker: ^10.3.2
  firebase_storage: ^12.3.7
  http: ^1.1.0
  audioplayers: ^6.1.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.10
  flutter_blurhash: ^0.8.2
  better_player: ^0.0.84
  image: ^4.3.0
  blurhash: ^1.2.0
  video_thumbnail: ^0.5.3
  mapbox_maps_flutter: ^2.10.0
  geocoding: ^4.0.0
  flutter_svg: ^2.2.1
  ar_flutter_plugin_updated: ^0.0.1
  vector_math: ^2.1.4
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/hourglass.json
    - assets/images/quomia_logo.png
    - assets/images/audio-record-image-placeholder.png
    - assets/images/marker.png
    - assets/images/location_pin.png
    - assets/icons/nft.svg
    - assets/models/box.glb
